---
kind: Secret
apiVersion: v1
metadata:
  annotations:
    opendatahub.io/connection-hidden: 'false'
    opendatahub.io/connection-type-protocol: oci
    opendatahub.io/connection-type-ref: oci-v1
    openshift.io/display-name: granite-vision-model-oci
  name: granite-vision-model-oci
  labels:
    opendatahub.io/dashboard: 'true'
stringData:
  .dockerconfigjson: '{}'
  ACCESS_TYPE: ''
  OCI_HOST: image-registry.openshift-image-registry.svc
type: kubernetes.io/dockerconfigjson
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-vision-model-oci
  annotations:
    modelFormat: vLLM
    openshift.io/display-name: granite-vision-model-oci
    # opendatahub.io/connections - references the secret above
    # so dashboard magic works when you edit the deployment
    opendatahub.io/connections: granite-vision-model-oci
    # opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    # opendatahub.io/hardware-profile-name: workshop-profile
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: RollingUpdate
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--max-model-len=8192'
      modelFormat:
        name: vLLM
      name: ""
      resources:
        limits:
          cpu: "2"
          memory: 12Gi
        requests:
          cpu: "2"
          memory: 12Gi
      runtime: granite-vision-model
      storageUri: oci://image-registry.openshift-image-registry.svc:5000/modelcars/ibm-granite:granite-vision-3.3-2b
    timeout: 30
