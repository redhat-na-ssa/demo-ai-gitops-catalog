apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  annotations:
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/description: This profile offers 2 CPUs and 4 GiB of memory. You
      can customize these resources up to 4 CPUs and 12 GiB of memory.
    opendatahub.io/disabled: "false"
    opendatahub.io/display-name: Workshop
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/part-of: hardwareprofile
    app.opendatahub.io/hardwareprofile: "true"
  name: workshop-profile
  namespace: redhat-ods-applications
spec:
  identifiers:
  - defaultCount: 2
    displayName: CPU
    identifier: cpu
    maxCount: 4
    minCount: 1
    resourceType: CPU
  - defaultCount: 4Gi
    displayName: Memory
    identifier: memory
    maxCount: 12Gi
    minCount: 2Gi
    resourceType: Memory
