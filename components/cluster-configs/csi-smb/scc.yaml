# oc adm policy add-scc-to-user node-exporter -z csi-smb-node-sa --dry-run -o yaml
# oc adm policy add-scc-to-user node-exporter -z csi-smb-controller-sa --dry-run -o yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-smb-node-exporter
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - node-exporter
  resources:
  - securitycontextconstraints
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-smb-node-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-smb-node-exporter
subjects:
- kind: ServiceAccount
  name: csi-smb-node-sa
  namespace: csi-smb-driver
- kind: ServiceAccount
  name: csi-smb-controller-sa
  namespace: csi-smb-driver
