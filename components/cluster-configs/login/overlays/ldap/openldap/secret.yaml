apiVersion: v1
kind: Secret
metadata:
  name: openldap-admin-secret
  namespace: auth
type: Opaque
stringData:
  LDAP_ADMIN_PASSWORD: "alongpassword"
  bootstrap-ldif: |
    # ======================================================================
    # Example bootstrap LDIF
    # Matches LDAP_DOMAIN=example.org, Base DN: dc=example,dc=org
    #
    # You can copy this file and adapt:
    #   - company name
    #   - users / groups
    #   - domain (dc=...)   <-- MUST match your configured LDAP_DOMAIN
    # ======================================================================

    dn: ou=users,dc=example,dc=org
    objectClass: top
    objectClass: organizationalUnit
    ou: users

    dn: ou=groups,dc=example,dc=org
    objectClass: top
    objectClass: organizationalUnit
    ou: groups

    # -------------------------------------------------------------------
    # LDAP bind user (service account)
    # -------------------------------------------------------------------
    dn: uid=ldapbind,ou=users,dc=example,dc=org
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    cn: LDAP Bind User
    sn: Bind
    uid: ldapbind
    userPassword: ldapbind123

    # -------------------------------------------------------------------
    # Admin user
    # -------------------------------------------------------------------
    dn: uid=adminuser,ou=users,dc=example,dc=org
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    cn: Example Admin
    sn: Admin
    uid: adminuser
    userPassword: admin123

    # -------------------------------------------------------------------
    # Regular test user
    # -------------------------------------------------------------------
    dn: uid=testuser,ou=users,dc=example,dc=org
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    cn: Test User
    sn: User
    uid: testuser
    userPassword: testuser123

    # -------------------------------------------------------------------
    # Admin group
    # -------------------------------------------------------------------
    dn: cn=example-admins,ou=groups,dc=example,dc=org
    objectClass: top
    objectClass: groupOfUniqueNames
    cn: example-admins
    uniqueMember: uid=adminuser,ou=users,dc=example,dc=org

    # -------------------------------------------------------------------
    # Users group
    # -------------------------------------------------------------------
    dn: cn=example-users,ou=groups,dc=example,dc=org
    objectClass: top
    objectClass: groupOfUniqueNames
    cn: example-users
    uniqueMember: uid=testuser,ou=users,dc=example,dc=org
